name: dbt CI

# Manual trigger only - click "Run workflow" in the Actions tab.
# (Not on every push: this needs a GCP_SA_KEY repo secret to connect to
# BigQuery, which isn't set up yet - a push-triggered run would just fail
# red until it is. Once the secret is added, feel free to switch this back
# to `on: push:`/`pull_request:` with the amazon_ads_dbt/** path filter.)
#
# Requires one repo secret: GCP_SA_KEY - the JSON key of a BigQuery
# service account with access to the amazon-ads-mmm project. Add it under
# Settings > Secrets and variables > Actions > New repository secret.

on:
  workflow_dispatch: {}

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amazon_ads_dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt
        run: pip install dbt-bigquery
      - name: Write GCP service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp_sa_key.json
      - name: Write dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          amazon_ads_dbt:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: service-account
                keyfile: /tmp/gcp_sa_key.json
                project: amazon-ads-mmm
                dataset: amazon_ads_warehouse
                threads: 4
                location: US
          EOF
      - name: dbt deps
        run: dbt deps
      - name: dbt build (run + test)
        run: dbt build
