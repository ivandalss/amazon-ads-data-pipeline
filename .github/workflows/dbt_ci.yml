name: dbt CI

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: amazon_ads_dbt
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/1063528864686/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "dbt-service-account@amazon-ads-mmm.iam.gserviceaccount.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt
        run: pip install dbt-bigquery
      - name: Write dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          amazon_ads_dbt:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: amazon-ads-mmm
                dataset: amazon_ads_warehouse
                threads: 4
                location: US
          EOF
      - name: dbt deps
        run: dbt deps
      - name: dbt build (run + test)
        run: dbt build
