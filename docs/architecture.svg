<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Helvetica, Arial, sans-serif">

  <!-- Styles -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F3A5F">
    Amazon Ads Analytics — Pipeline Architecture
  </text>
  <text x="550" y="52" text-anchor="middle" font-size="12" fill="#666">
    From raw marketplace reports to analytical insights — language used at each stage
  </text>

  <!-- Legend -->
  <rect x="780" y="70" width="290" height="60" rx="6" fill="#FAFAFA" stroke="#CCC"/>
  <text x="795" y="90" font-size="11" font-weight="bold" fill="#333">Legend</text>
  <rect x="795" y="98" width="14" height="14" fill="#FFF3CD" stroke="#856404"/>
  <text x="815" y="110" font-size="11" fill="#333">Python (pandas)</text>
  <rect x="930" y="98" width="14" height="14" fill="#D1E7FF" stroke="#0B5394"/>
  <text x="950" y="110" font-size="11" fill="#333">SQL (SQLite)</text>
  <rect x="795" y="115" width="14" height="14" fill="#E8E8E8" stroke="#666"/>
  <text x="815" y="127" font-size="11" fill="#333">Files / storage</text>

  <!-- =========================================================== -->
  <!-- STAGE 1: RAW SOURCES                                          -->
  <!-- =========================================================== -->
  <text x="60" y="90" font-size="13" font-weight="bold" fill="#1F3A5F">1. Raw sources</text>

  <g>
    <rect x="60" y="100" width="180" height="44" rx="4" fill="#E8E8E8" stroke="#666"/>
    <text x="150" y="120" text-anchor="middle" font-size="11" font-weight="bold">Bulk File (.xlsx)</text>
    <text x="150" y="134" text-anchor="middle" font-size="10" fill="#666">11 sheets, ~48 cols</text>
  </g>
  <g>
    <rect x="60" y="150" width="180" height="44" rx="4" fill="#E8E8E8" stroke="#666"/>
    <text x="150" y="170" text-anchor="middle" font-size="11" font-weight="bold">Search Term Report</text>
    <text x="150" y="184" text-anchor="middle" font-size="10" fill="#666">25 cols</text>
  </g>
  <g>
    <rect x="60" y="200" width="180" height="44" rx="4" fill="#E8E8E8" stroke="#666"/>
    <text x="150" y="220" text-anchor="middle" font-size="11" font-weight="bold">Advertised Product</text>
    <text x="150" y="234" text-anchor="middle" font-size="10" fill="#666">25 cols</text>
  </g>
  <g>
    <rect x="60" y="250" width="180" height="44" rx="4" fill="#E8E8E8" stroke="#666"/>
    <text x="150" y="270" text-anchor="middle" font-size="11" font-weight="bold">Business Report</text>
    <text x="150" y="284" text-anchor="middle" font-size="10" fill="#666">20 cols (ads + organic)</text>
  </g>

  <!-- =========================================================== -->
  <!-- STAGE 2: ANONYMIZE (Python)                                   -->
  <!-- =========================================================== -->
  <text x="300" y="90" font-size="13" font-weight="bold" fill="#1F3A5F">2. Anonymize</text>

  <rect x="300" y="100" width="180" height="194" rx="6" fill="#FFF3CD" stroke="#856404" stroke-width="1.5"/>
  <text x="390" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#856404">src/anonymize.py</text>
  <text x="390" y="148" text-anchor="middle" font-size="10" fill="#333">Read .xlsx → pandas</text>
  <text x="390" y="165" text-anchor="middle" font-size="10" fill="#333">Strip brand names</text>
  <text x="390" y="182" text-anchor="middle" font-size="10" fill="#333">Hash IDs (SHA-1)</text>
  <text x="390" y="199" text-anchor="middle" font-size="10" fill="#333">Sanitize free-text</text>
  <text x="390" y="216" text-anchor="middle" font-size="10" fill="#333">Write to .csv</text>
  <line x1="320" y1="232" x2="460" y2="232" stroke="#856404" stroke-dasharray="2,2"/>
  <text x="390" y="252" text-anchor="middle" font-size="9" fill="#856404" font-style="italic">→ data/processed/</text>
  <text x="390" y="266" text-anchor="middle" font-size="9" fill="#856404" font-style="italic">*.csv (safe to commit)</text>

  <!-- Arrows raw → anonymize -->
  <line x1="240" y1="122" x2="296" y2="160" stroke="#555" marker-end="url(#arrow)" stroke-width="1.5"/>
  <line x1="240" y1="172" x2="296" y2="180" stroke="#555" marker-end="url(#arrow)" stroke-width="1.5"/>
  <line x1="240" y1="222" x2="296" y2="210" stroke="#555" marker-end="url(#arrow)" stroke-width="1.5"/>
  <line x1="240" y1="272" x2="296" y2="240" stroke="#555" marker-end="url(#arrow)" stroke-width="1.5"/>

  <!-- =========================================================== -->
  <!-- STAGE 3: TRANSFORM + LOAD (Python builds tables)             -->
  <!-- =========================================================== -->
  <text x="540" y="90" font-size="13" font-weight="bold" fill="#1F3A5F">3. Transform + Load</text>

  <rect x="540" y="100" width="200" height="194" rx="6" fill="#FFF3CD" stroke="#856404" stroke-width="1.5"/>
  <text x="640" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#856404">src/load.py</text>
  <text x="640" y="148" text-anchor="middle" font-size="10" fill="#333">Read processed CSVs</text>
  <text x="640" y="165" text-anchor="middle" font-size="10" fill="#333">Build dim_date from</text>
  <text x="640" y="178" text-anchor="middle" font-size="10" fill="#333">observed dates</text>
  <text x="640" y="198" text-anchor="middle" font-size="10" fill="#333">Build dim_campaign,</text>
  <text x="640" y="211" text-anchor="middle" font-size="10" fill="#333">dim_product (joins, dedup)</text>
  <text x="640" y="231" text-anchor="middle" font-size="10" fill="#333">Group-by to fact grain</text>
  <text x="640" y="251" text-anchor="middle" font-size="10" fill="#333">Type conversion + cleanup</text>
  <line x1="560" y1="266" x2="720" y2="266" stroke="#856404" stroke-dasharray="2,2"/>
  <text x="640" y="284" text-anchor="middle" font-size="9" fill="#856404" font-style="italic">→ to_sql() → warehouse.db</text>

  <!-- Arrow anonymize → transform -->
  <line x1="480" y1="197" x2="536" y2="197" stroke="#555" marker-end="url(#arrow)" stroke-width="1.5"/>

  <!-- =========================================================== -->
  <!-- STAGE 4: WAREHOUSE                                            -->
  <!-- =========================================================== -->
  <text x="60" y="340" font-size="13" font-weight="bold" fill="#1F3A5F">4. Star-schema warehouse (SQLite)</text>

  <rect x="60" y="350" width="680" height="170" rx="6" fill="#D1E7FF" stroke="#0B5394" stroke-width="1.5"/>
  <text x="400" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#0B5394">data/warehouse.db   (defined in sql/01_schema.sql)</text>

  <!-- Dimensions -->
  <text x="80" y="402" font-size="11" font-weight="bold" fill="#1F3A5F">Dimensions</text>
  <rect x="80" y="410" width="140" height="34" rx="3" fill="#FFF" stroke="#0B5394"/>
  <text x="150" y="425" text-anchor="middle" font-size="11" font-weight="bold">dim_date</text>
  <text x="150" y="438" text-anchor="middle" font-size="9" fill="#666">date_id, week, month...</text>

  <rect x="80" y="452" width="140" height="34" rx="3" fill="#FFF" stroke="#0B5394"/>
  <text x="150" y="467" text-anchor="middle" font-size="11" font-weight="bold">dim_campaign</text>
  <text x="150" y="480" text-anchor="middle" font-size="9" fill="#666">id, name, portfolio...</text>

  <rect x="80" y="494" width="140" height="34" rx="3" fill="#FFF" stroke="#0B5394"/>
  <text x="150" y="509" text-anchor="middle" font-size="11" font-weight="bold">dim_product</text>
  <text x="150" y="522" text-anchor="middle" font-size="9" fill="#666">asin, sku, title</text>

  <!-- Facts -->
  <text x="265" y="402" font-size="11" font-weight="bold" fill="#1F3A5F">Fact tables</text>
  <rect x="265" y="410" width="180" height="44" rx="3" fill="#FFF" stroke="#0B5394"/>
  <text x="355" y="428" text-anchor="middle" font-size="11" font-weight="bold">fact_ads_daily</text>
  <text x="355" y="443" text-anchor="middle" font-size="9" fill="#666">date × campaign × ASIN</text>

  <rect x="265" y="464" width="180" height="44" rx="3" fill="#FFF" stroke="#0B5394"/>
  <text x="355" y="482" text-anchor="middle" font-size="11" font-weight="bold">fact_search_term</text>
  <text x="355" y="497" text-anchor="middle" font-size="9" fill="#666">date × campaign × query</text>

  <rect x="480" y="410" width="180" height="44" rx="3" fill="#FFF" stroke="#0B5394"/>
  <text x="570" y="428" text-anchor="middle" font-size="11" font-weight="bold">fact_business_report</text>
  <text x="570" y="443" text-anchor="middle" font-size="9" fill="#666">snapshot × ASIN (ads+organic)</text>

  <!-- Notes -->
  <text x="480" y="475" font-size="10" font-weight="bold" fill="#0B5394">Joins via:</text>
  <text x="480" y="490" font-size="10" fill="#333">facts.campaign_id → dim_campaign</text>
  <text x="480" y="503" font-size="10" fill="#333">facts.asin → dim_product</text>
  <text x="480" y="516" font-size="10" fill="#333">facts.date_id → dim_date</text>

  <!-- Arrow transform → warehouse -->
  <line x1="640" y1="296" x2="640" y2="348" stroke="#555" marker-end="url(#arrow)" stroke-width="1.5"/>

  <!-- =========================================================== -->
  <!-- STAGE 5: ANALYTICAL QUERIES (SQL)                            -->
  <!-- =========================================================== -->
  <text x="760" y="340" font-size="13" font-weight="bold" fill="#1F3A5F">5. Analytical queries</text>

  <rect x="760" y="350" width="310" height="170" rx="6" fill="#D1E7FF" stroke="#0B5394" stroke-width="1.5"/>
  <text x="915" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#0B5394">sql/queries/*.sql</text>

  <text x="775" y="398" font-size="10" fill="#333">Q1 — Campaign ROAS + portfolio TACoS</text>
  <text x="775" y="416" font-size="10" fill="#333">Q2 — Harvestable search terms (ROW_NUMBER)</text>
  <text x="775" y="434" font-size="10" fill="#333">Q3 — Wasted-spend detection</text>
  <text x="775" y="452" font-size="10" fill="#333">Q4 — Ads vs organic synergy per ASIN</text>
  <text x="775" y="470" font-size="10" fill="#333">Q5 — Daily trend + rolling avg (LAG, window)</text>

  <line x1="780" y1="482" x2="1050" y2="482" stroke="#0B5394" stroke-dasharray="2,2"/>
  <text x="915" y="500" text-anchor="middle" font-size="9" fill="#0B5394" font-style="italic">CTEs, JOINs, window functions,</text>
  <text x="915" y="513" text-anchor="middle" font-size="9" fill="#0B5394" font-style="italic">aggregations, conditional logic</text>

  <!-- Arrow warehouse → queries -->
  <line x1="744" y1="435" x2="756" y2="435" stroke="#555" marker-end="url(#arrow)" stroke-width="1.5"/>

  <!-- =========================================================== -->
  <!-- STAGE 6: ANALYSIS (Python)                                   -->
  <!-- =========================================================== -->
  <text x="60" y="558" font-size="13" font-weight="bold" fill="#1F3A5F">6. Analysis &amp; visualization</text>

  <rect x="60" y="568" width="680" height="120" rx="6" fill="#FFF3CD" stroke="#856404" stroke-width="1.5"/>
  <text x="400" y="592" text-anchor="middle" font-size="12" font-weight="bold" fill="#856404">notebooks/analysis.ipynb</text>

  <text x="80" y="615" font-size="10" fill="#333">• Execute each SQL query against warehouse.db (sqlite3 + pandas)</text>
  <text x="80" y="632" font-size="10" fill="#333">• Render results as tables with business interpretation</text>
  <text x="80" y="649" font-size="10" fill="#333">• Build charts (matplotlib): trend lines, distribution of ROAS, top-N bars</text>
  <text x="80" y="666" font-size="10" fill="#333">• Translate analytical output into recommendations (harvest list, negatives, reallocation)</text>
  <text x="80" y="683" font-size="10" fill="#333">• Document data quality issues found (e.g., ASIN mismatch between facts)</text>

  <!-- Arrow queries → analysis -->
  <line x1="915" y1="525" x2="640" y2="563" stroke="#555" marker-end="url(#arrow)" stroke-width="1.5"/>

  <!-- =========================================================== -->
  <!-- LANGUAGE STRIP (right side)                                  -->
  <!-- =========================================================== -->
  <text x="760" y="558" font-size="13" font-weight="bold" fill="#1F3A5F">Where each language is used</text>

  <rect x="760" y="568" width="310" height="120" rx="6" fill="#FAFAFA" stroke="#CCC"/>
  <text x="780" y="592" font-size="11" font-weight="bold" fill="#856404">Python:</text>
  <text x="780" y="608" font-size="10" fill="#333">• Read Excel sources</text>
  <text x="780" y="623" font-size="10" fill="#333">• Anonymization / hashing</text>
  <text x="780" y="638" font-size="10" fill="#333">• Schema-shaping transforms</text>
  <text x="780" y="653" font-size="10" fill="#333">• Loading into SQLite</text>
  <text x="780" y="668" font-size="10" fill="#333">• Plotting and notebook narrative</text>

  <text x="940" y="592" font-size="11" font-weight="bold" fill="#0B5394">SQL:</text>
  <text x="940" y="608" font-size="10" fill="#333">• Schema definition (DDL)</text>
  <text x="940" y="623" font-size="10" fill="#333">• Joins across facts/dims</text>
  <text x="940" y="638" font-size="10" fill="#333">• Aggregations, window funcs</text>
  <text x="940" y="653" font-size="10" fill="#333">• Business logic via CTEs</text>
  <text x="940" y="668" font-size="10" fill="#333">• All analytical computations</text>

  <!-- Footer -->
  <text x="550" y="710" text-anchor="middle" font-size="10" fill="#999" font-style="italic">
    Iván Dalesson · amz-ads-analytics
  </text>

</svg>
