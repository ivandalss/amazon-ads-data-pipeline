version: 2

models:
  - name: dim_date
    description: "Date dimension spanning 2025-01-01 to 2026-12-31, one row per day."
    columns:
      - name: date_id
        description: "Primary key - the calendar date."
        data_tests:
          - unique
          - not_null

  - name: dim_campaign
    description: "Campaign dimension, deduplicated from the bulk file. One row per campaign_id."
    columns:
      - name: campaign_id
        description: "Primary key - unique campaign identifier (hashed)."
        data_tests:
          - unique
          - not_null
      - name: campaign_name
        description: >
          Campaign name. Not the formal PK, but the join key used by every
          fact table (facts only carry campaign_name, not campaign_id).
          Dedup picks NULLS LAST on purpose - see the model SQL.
        data_tests:
          - not_null
      - name: ad_product
        description: "Ad product / channel this campaign belongs to (e.g. Sponsored Products, Sponsored Brands, Sponsored Display), from the bulk file's Product column."

  - name: dim_product
    description: "Product dimension, deduplicated from the bulk file. One row per SKU."
    columns:
      - name: sku
        description: "Primary key - unique SKU identifier."
        data_tests:
          - unique
          - not_null
      - name: asin
        description: >
          ASIN associated with the SKU (child/variant ASIN from the bulk
          file). Referenced by fact_ads_daily.asin. NOT necessarily the
          same identifier space as fact_business_report.parent_asin - see
          the note on that test below.

  - name: fact_ads_daily
    description: >
      Daily advertising performance grain: date x campaign x ASIN.
      Incremental (insert_overwrite, partitioned on date_id) with a 3-day
      lookback window to absorb late-arriving/corrected report rows.
    columns:
      - name: date_id
        description: "Foreign key to dim_date."
        data_tests:
          - not_null
      - name: asin
        description: "Foreign key to dim_product (via ASIN)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: asin
      - name: campaign_name
        description: >
          Foreign key to dim_campaign (via campaign_name - see note on
          dim_campaign.campaign_name). 196 rows (182 distinct campaign
          names, spread evenly across the whole February date range) don't
          resolve. Confirmed against the raw data: every campaign_name in
          dim_campaign IS present in the Advertised Product report (0
          names the other way), so this isn't a join/anonymization bug -
          it's 182 campaigns with real spend in the report's date range
          that the *current* bulk-file snapshot no longer contains (bulk
          file reflects account structure as configured today; likely
          paused/archived/deleted since). Same root cause as the smaller
          gap on fact_search_term, just larger here because the AP report
          covers a full month. Set to warn rather than fail; would need a
          bulk-file pull from closer to the report's date range to close
          fully.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_name
              config:
                severity: warn
      - name: impressions
        description: "Total impressions for the day/campaign/ASIN combination."
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date_id
              - campaign_name
              - asin

  - name: fact_search_term
    description: "Daily search term performance grain: date x campaign x search term x match type."
    columns:
      - name: date_id
        data_tests:
          - not_null
      - name: campaign_name
        description: >
          Foreign key to dim_campaign (via campaign_name). A handful (3) of
          rows don't resolve - likely campaigns present in the search-term
          report's date range but absent from the bulk-file snapshot used
          to build dim_campaign (different extract times). Small enough
          and explained enough to warn rather than fail the build; worth
          investigating with a fresher bulk-file pull if it grows.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_name
              config:
                severity: warn
      - name: customer_search_term
        description: "The actual search query that triggered the ad."
        data_tests:
          - not_null

  - name: fact_business_report
    description: "Business report snapshot grain: one row per ASIN, includes organic + ad sales."
    columns:
      - name: parent_asin
        description: >
          Primary key - parent ASIN (hashed). NOTE: this is the *parent*
          ASIN from the Business Report; dim_product.asin comes from the
          bulk file and may be a child/variant ASIN instead - they are not
          confirmed to be the same identifier space yet. The relationships
          test below is set to warn (not fail the build) until that's
          verified against real data - see amazon_ads_dbt/README.md.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: asin
              config:
                severity: warn

  - name: fact_weekly_channel_performance
    description: >
      Weekly advertising performance rolled up by ad product / channel
      (SP/SB/SD), built from fact_ads_daily joined to dim_campaign for the
      channel attribute. One row per (week, ad_product).
    columns:
      - name: week
        description: "Calendar week (BigQuery date_trunc(..., week)) the spend/sales fall into."
        data_tests:
          - not_null
      - name: ad_product
        description: "Ad product / channel from dim_campaign.ad_product; 'unknown' when a campaign_name has no bulk-file match."
        data_tests:
          - not_null
      - name: total_spend
        data_tests:
          - not_null
      - name: total_sales
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - week
              - ad_product
